<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title data-i18n="task.detail_title">任务详情</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="task-window">
    <div class="task-wrap">
      <header class="task-head" data-tauri-drag-region>
        <h2 id="detailTitle" data-tauri-drag-region>任务详情</h2>
      </header>
      <div class="detail-meta" id="detailMeta"><span data-i18n="task.loading">加载中…</span></div>
      <div class="detail-actions">
        <button class="ghost" id="copyText" type="button" data-i18n="task.copy_text">复制文本</button>
        <button class="ghost" id="toggleTime" type="button">显示纯文本</button>
        <button class="ghost" id="saveTxt" type="button" data-i18n="task.save_txt">保存 TXT</button>
        <button class="ghost" id="saveSrt" type="button" data-i18n="task.save_srt">保存 SRT</button>
        <button class="ghost" id="saveLrc" type="button" data-i18n="task.save_lrc">保存 LRC</button>
      </div>
      <pre class="detail-text" id="detailText"><span data-i18n="task.loading">加载中…</span></pre>
      <div class="detail-log-head">
        <span data-i18n="task.log_title">运行日志</span>
        <button class="ghost" id="copyLog" type="button" data-i18n="task.copy_log">复制日志</button>
      </div>
      <pre class="detail-log" id="detailLog" data-i18n="task.no_log">（暂无日志）</pre>
    </div>
    <script src="locales/zh-CN.js"></script>
    <script src="i18n.js"></script>
    <script type="module" src="task-detail.js"></script>
  </body>
</html>
